<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Happy Women's Day 8/3</title>

<style>

body{
margin:0;
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
color:white;
overflow-x:hidden;
}

h1{
margin-top:25px;
font-size:50px;
}

/* slideshow */

#slideshow{
width:100%;
height:300px;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

#slideshow img{
width:300px;
height:220px;
object-fit:cover;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* gallery */

.gallery{
display:none;
width:90%;
margin:auto;
margin-top:30px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}

.gallery img{
width:100%;
height:150px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
transition:0.4s;
}

.gallery img:hover{
transform:scale(1.1);
}

/* phóng to ảnh */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
animation:fade 0.5s;
}

.lightbox img{
max-width:80%;
max-height:70%;
border-radius:15px;
animation:zoom 0.6s;
}

@keyframes zoom{
from{transform:scale(0.5)}
to{transform:scale(1)}
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}

/* phong thư */

.envelope{
margin-top:40px;
font-size:60px;
cursor:pointer;
}

.message{
display:none;
width:70%;
margin:20px auto;
background:rgba(255,255,255,0.25);
padding:20px;
border-radius:20px;
font-size:20px;
}

/* tim + hoa */

.heart,.flower{
position:fixed;
top:-10px;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(-10px)}
100%{transform:translateY(110vh)}
}

/* sparkle */

.sparkle{
position:fixed;
font-size:10px;
animation:spark 2s infinite;
}

@keyframes spark{
0%,100%{opacity:0}
50%{opacity:1}
}

.music-btn{
margin-top:15px;
padding:10px 20px;
border:none;
border-radius:20px;
background:white;
color:#ff4d6d;
cursor:pointer;
}

</style>
</head>

<body>

<h1>💐 Happy Women's Day 8/3 💐</h1>

<button class="music-btn" onclick="playMusic()">🎵 Bật nhạc</button>

<div id="slideshow">
<img id="slideImg" src="anh1.jpg">
</div>

<div class="gallery" id="gallery">

<img src="anh1.jpg">
<img src="anh2.jpg">
<img src="anh3.jpg">
<img src="anh4.jpg">
<img src="anh5.jpg">
<img src="anh6.jpg">
<img src="anh7.jpg">
<img src="anh8.jpg">
<img src="anh9.jpg">
<img src="anh10.jpg">
<img src="anh11.jpg">
<img src="anh12.jpg">
<img src="anh13.jpg">
<img src="anh14.jpg">
<img src="anh15.jpg">
<img src="anh16.jpg">
<img src="anh17.jpg">
<img src="anh18.jpg">
<img src="anh19.jpg">
<img src="anh20.jpg">
<img src="anh21.jpg">
<img src="anh22.jpg">
<img src="anh23.jpg">
<img src="anh24.jpg">

</div>

<div class="envelope" onclick="openLetter()">💌</div>

<div class="message" id="letter">
Chúc bạn một ngày 8/3 thật nhiều niềm vui và hạnh phúc.  
Mong rằng mỗi ngày của bạn đều tràn đầy tiếng cười và những điều tốt đẹp.  
Chúc bạn luôn xinh đẹp, mạnh mẽ và đạt được mọi ước mơ của mình ❤️
</div>

<div class="lightbox" id="lightbox">
<img id="bigImg">
<p>✨ Bấm bất kỳ đâu để đóng ✨</p>
</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

/* slideshow */

let index=1;
const slide=document.getElementById("slideImg");

const timer=setInterval(()=>{

index++;
if(index>24){
clearInterval(timer);
document.getElementById("slideshow").style.display="none";
document.getElementById("gallery").style.display="grid";
return;
}

slide.src="anh"+index+".jpg";

},800);

/* phóng to ảnh */

const gallery=document.querySelectorAll(".gallery img");
const lightbox=document.getElementById("lightbox");
const big=document.getElementById("bigImg");

gallery.forEach(img=>{
img.onclick=()=>{
lightbox.style.display="flex";
big.src=img.src;
}
});

lightbox.onclick=()=>{
lightbox.style.display="none";
}

/* phong thư */

function openLetter(){
document.getElementById("letter").style.display="block";
}

/* nhạc */

function playMusic(){
document.getElementById("music").play();
}

/* tim */

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=3+Math.random()*5+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},400);

/* hoa */

setInterval(()=>{
let f=document.createElement("div");
f.className="flower";
f.innerHTML="🌹";
f.style.left=Math.random()*100+"vw";
f.style.animationDuration=4+Math.random()*5+"s";
document.body.appendChild(f);
setTimeout(()=>f.remove(),8000);
},500);

/* sparkle */

setInterval(()=>{
let s=document.createElement("div");
s.className="sparkle";
s.innerHTML="✨";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
setTimeout(()=>s.remove(),2000);
},300);

</script>

</body>
</html>
